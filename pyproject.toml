[project]
name = "dubbed"
version = "1.0.2"
description = "Username generator that never leaves your machine."
readme = "src/dubbed/resources/PYPI_README.md"
license = "MIT"
authors = [{ name = "Melvin Quick", email = "melvinquick@proton.me" }]
requires-python = ">=3.10"
dependencies = ["pyside6>=6.8.2.1", "pyyaml>=6.0.2"]

[project.urls]
repository = "https://github.com/melvinquick/dubbed"
issues = "https://github.com/melvinquick/dubbed/issues"

[project.gui-scripts]
dubbed = "dubbed.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["bandit>=1.8.3"]
